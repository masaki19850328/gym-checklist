<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>今日のジム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="今日のジム">
  <meta name="theme-color" content="#111111">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { --accent: #d4ff4f; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
      background: #111;
      color: #eee;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      position: sticky;
      top: 0;
      background: #111;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; }
    .date { font-size: 13px; color: #888; }
    main { padding: 14px 16px 100px; max-width: 680px; margin: 0 auto; }
    .progress {
      font-size: 12px;
      color: #aaa;
      margin: 4px 2px 16px;
      letter-spacing: .04em;
    }
    .progress b { color: var(--accent); font-weight: 700; }
    .section {
      background: #1c1c1c;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .section h2 {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section .count {
      font-size: 12px;
      color: #888;
      font-weight: 400;
      margin-left: auto;
    }
    .section.complete h2 .count { color: var(--accent); }
    ul.items { list-style: none; margin: 0; padding: 0; }
    li.item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: background .15s;
    }
    li.item + li.item { border-top: 1px solid #262626; }
    li.item:active { background: #232323; }
    li.item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #555;
      border-radius: 6px;
      background: transparent;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      transition: all .15s;
    }
    li.item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    li.item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 1px;
      width: 6px;
      height: 12px;
      border: solid #111;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }
    li.item .label {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
    }
    li.item.done .label {
      color: #777;
      text-decoration: line-through;
      text-decoration-color: #555;
    }
    .memo-section { margin-top: 22px; }
    .memo-section label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    textarea.memo {
      width: 100%;
      min-height: 80px;
      background: #1c1c1c;
      color: #eee;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      line-height: 1.5;
    }
    textarea.memo:focus { outline: none; border-color: var(--accent); }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    button {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: .02em;
    }
    button.primary {
      background: var(--accent);
      color: #111;
      border: none;
    }
    button.primary:active { background: #b8e040; }
    button.secondary {
      background: transparent;
      color: #bbb;
      border: 1px solid #3a3a3a;
    }
    button.secondary:active { background: #1c1c1c; }
  </style>
</head>
<body>
  <header>
    <h1>今日のジム</h1>
    <div class="date" id="dateLabel"></div>
  </header>
  <main>
    <div class="progress" id="progress"></div>
    <div id="sections"></div>
    <div class="memo-section">
      <label for="memo">メモ</label>
      <textarea id="memo" class="memo" placeholder="体調・気づき・コンディションなど"></textarea>
    </div>
    <div class="actions">
      <button class="primary" id="csvBtn">CSV書き出し</button>
      <button class="secondary" id="resetBtn">今日をリセット</button>
    </div>
  </main>
  <script>
    const STORAGE_KEY = 'gym_routine_v2';
    const ROUTINE = [
      { id: 'legpress', title: 'レッグプレス', items: ['1セット目：10回', '2セット目：10回', '3セット目：10回'] },
      { id: 'chestpress', title: 'チェストプレス', items: ['1セット目：10回', '2セット目：10回', '3セット目：10回'] },
      { id: 'latpulldown', title: 'ラットプルダウン', items: ['1セット目：10回', '2セット目：10回', '3セット目：10回'] },
      { id: 'seatedrow', title: 'シーテッドロー', items: ['1セット目：10回', '2セット目：10回', '3セット目：10回'] },
      { id: 'shoulderpress', title: 'ショルダープレス', items: ['1セット目：10回', '2セット目：10回', '3セット目：10回'] },
      { id: 'plank', title: 'プランク', items: ['1回目：30〜45秒', '2回目：30〜45秒', '3回目：30〜45秒'] },
      { id: 'treadmill', title: 'トレッドミル', items: ['時速6kmで20分', '余力があれば30分まで延長'] },
      { id: 'aftergym', title: 'ジム後', items: ['タンパク質30g前後を摂る', '今日の合計歩数8,000〜10,000歩を確認', '夜の間食を控える'] },
    ];

    const today = () => new Date().toISOString().slice(0, 10);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { console.warn('load failed', e); }
      return { sessions: {} };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) { console.warn('save failed', e); }
    }

    function ensureToday() {
      const d = today();
      if (!state.sessions[d]) state.sessions[d] = { checks: {}, memo: '' };
      if (!state.sessions[d].checks) state.sessions[d].checks = {};
      if (typeof state.sessions[d].memo !== 'string') state.sessions[d].memo = '';
      return state.sessions[d];
    }

    let state = loadState();

    function checkKey(sectionId, idx) { return `${sectionId}:${idx}`; }

    function totalItems() {
      return ROUTINE.reduce((s, sec) => s + sec.items.length, 0);
    }

    function doneCount() {
      const data = ensureToday();
      let n = 0;
      ROUTINE.forEach(sec => sec.items.forEach((_, i) => {
        if (data.checks[checkKey(sec.id, i)]) n++;
      }));
      return n;
    }

    function updateProgress() {
      const done = doneCount();
      const total = totalItems();
      document.getElementById('progress').innerHTML = `完了 <b>${done}</b> / ${total}`;
    }

    function render() {
      document.getElementById('dateLabel').textContent = today();
      const data = ensureToday();
      const wrap = document.getElementById('sections');
      wrap.innerHTML = '';

      ROUTINE.forEach(sec => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'section';

        const doneInSec = sec.items.filter((_, i) => data.checks[checkKey(sec.id, i)]).length;
        if (doneInSec === sec.items.length) sectionEl.classList.add('complete');

        const h2 = document.createElement('h2');
        h2.textContent = sec.title;
        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = `${doneInSec}/${sec.items.length}`;
        h2.appendChild(count);
        sectionEl.appendChild(h2);

        const ul = document.createElement('ul');
        ul.className = 'items';

        sec.items.forEach((label, i) => {
          const key = checkKey(sec.id, i);
          const li = document.createElement('li');
          li.className = 'item' + (data.checks[key] ? ' done' : '');

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = !!data.checks[key];
          cb.addEventListener('click', (e) => e.stopPropagation());
          cb.addEventListener('change', () => toggle(sec, i, cb.checked, li, sectionEl, count));

          const txt = document.createElement('div');
          txt.className = 'label';
          txt.textContent = label;

          li.appendChild(cb);
          li.appendChild(txt);
          li.addEventListener('click', () => {
            cb.checked = !cb.checked;
            toggle(sec, i, cb.checked, li, sectionEl, count);
          });
          ul.appendChild(li);
        });

        sectionEl.appendChild(ul);
        wrap.appendChild(sectionEl);
      });

      document.getElementById('memo').value = data.memo;
      updateProgress();
    }

    function toggle(sec, idx, checked, liEl, sectionEl, countEl) {
      const data = ensureToday();
      const key = checkKey(sec.id, idx);
      if (checked) data.checks[key] = true; else delete data.checks[key];
      saveState();
      liEl.classList.toggle('done', checked);
      const doneInSec = sec.items.filter((_, i) => data.checks[checkKey(sec.id, i)]).length;
      countEl.textContent = `${doneInSec}/${sec.items.length}`;
      sectionEl.classList.toggle('complete', doneInSec === sec.items.length);
      updateProgress();
    }

    document.getElementById('memo').addEventListener('input', (e) => {
      ensureToday().memo = e.target.value;
      saveState();
    });

    function exportCSV() {
      const rows = [['date', 'section', 'item_index', 'item', 'done', 'memo']];
      Object.entries(state.sessions).forEach(([date, data]) => {
        const checks = data.checks || {};
        const memo = (data.memo || '').replace(/[\r\n]+/g, ' ');
        ROUTINE.forEach(sec => {
          sec.items.forEach((label, i) => {
            const key = checkKey(sec.id, i);
            rows.push([date, sec.title, i + 1, label, checks[key] ? '1' : '0', memo]);
          });
        });
      });
      const csv = rows.map(r => r.map(v => {
        const s = String(v ?? '');
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',')).join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gym_${today()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function resetToday() {
      if (!confirm('今日のチェックを全てリセットしますか？')) return;
      const d = today();
      if (state.sessions[d]) {
        state.sessions[d].checks = {};
        state.sessions[d].memo = '';
      }
      saveState();
      render();
    }

    document.getElementById('csvBtn').addEventListener('click', exportCSV);
    document.getElementById('resetBtn').addEventListener('click', resetToday);

    render();
  </script>
</body>
</html>
